name: G0 Isolation and Holdout CI

on:
  push:
    branches:
      - master
      - fix/g0-env-isolation-and-w2pp-holdout
      - fix/g0-close-w2pp-complete-guard
      - fix/replay-multipart-integrity
  pull_request:
    branches:
      - master
      - fix/g0-env-isolation-and-w2pp-holdout
      - fix/g0-close-w2pp-complete-guard
      - fix/replay-multipart-integrity

jobs:
  g0-isolation-and-w2pp:
    runs-on: ubuntu-latest
    env: {}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: pip install pytest ruff

      - name: Ruff check W2PP guard, calibration, and tests
        run: |
          ruff check \
            apps/market-worker/scripts/w2pp_holdout_guard.py \
            apps/market-worker/scripts/compute_calibration.py \
            tests/test_g0_env_and_w2pp_guard.py

      - name: Run G0 env-isolation, W2PP holdout, and W2 close-check tests
        run: |
          python -m pytest -ra \
            tests/test_g0_env_and_w2pp_guard.py \
            apps/market-worker/scripts/test_w2_close_check.py

  data-collector-replay-integrity:
    runs-on: ubuntu-latest
    env: {}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck @polyterminal/data-collector
        run: pnpm --filter @polyterminal/data-collector typecheck

      - name: Run multipart and fail-closed gzip replay integrity tests
        run: |
          pnpm --filter @polyterminal/data-collector exec tsx --test \
            tests/bookReconstructor.multipart.test.ts \
            tests/bookReconstructor.integrity.test.ts
